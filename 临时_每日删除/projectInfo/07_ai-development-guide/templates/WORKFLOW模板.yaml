workflow:
  name: “标准前端开发工作流 (Skills驱动)”
  version: “3.0”
  description: “一个基于离散技能组合的完整开发流程，从需求到上线。”

  stages:
    # 阶段 1: 需求分析
    - id: “requirement_analysis”
      name: “需求分析”
      description: “分析与拆解原始需求，形成结构化产品文档。”
      skills:
        - “business_requirement_analysis” # 业务需求分析技能
        - “user_story_mapping”           # 用户故事映射技能
        - “acceptance_criteria_writing”  # 验收标准编写技能
      trigger:
        type: “manual” # 由用户指令或项目创建触发
        command: “/开始需求分析”
      inputs:
        - type: “text”
          name: “原始需求描述”
          required: true
      outputs:
        - name: “产品需求文档(PRD)”
          format: “markdown”
          template: “templates/prd_template.md”
        - name: “用户故事列表”
          format: “json”
      next_stage: “design_review” # 进入设计方案评审
      validations:
        - skill: “spec_completeness_check”
          params: { “required_sections”: [“目标”, “用户故事”, “验收标准”] }

    # 阶段 2: 方案设计
    - id: “solution_design”
      name: “方案设计”
      description: “根据PRD进行技术方案、架构与UI设计。”
      skills:
        - “technical_architecture_design” # 技术架构设计
        - “frontend_framework_selection”  # 前端框架选型
        - “ui_ux_prototyping”            # UI/UX原型设计
        - “api_contract_design”          # API接口契约设计
      trigger:
        type: “auto”
        condition: “requirement_analysis.outputs.prd_approved == true”
      inputs:
        - type: “file”
          ref: “requirement_analysis.outputs.产品需求文档(PRD)”
      outputs:
        - name: “技术设计方案”
          format: “markdown”
        - name: “组件架构图”
          format: “mermaid” # 或图片
        - name: “API接口文档”
          format: “openapi” # YAML格式
      next_stage: “development”
      tools:
        - “draw.io” # 用于绘图
        - “swagger_editor” # 用于API设计

    # 阶段 3: 代码开发
    - id: “development”
      name: “代码开发”
      description: “基于技术方案进行具体编码实现。”
      skills:
        - “component_development” # 组件开发
        - “css_framework_styling”       # CSS框架样式编写
        - “unit_test_writing”           # 单元测试编写
		- “code_view”                   # 通过对比diff 进行cr
        - “git_workflow”               # Git工作流操作
      trigger:
        type: “auto”
        condition: “solution_design.outputs.design_approved == true”
      inputs:
        - type: “file”
          ref: “solution_design.outputs.技术设计方案”
      outputs:
        - name: “源代码”
          format: “directory”
          path: “./src/”
        - name: “单元测试报告”
          format: “jest_html”
        - name: “Git提交记录”
          format: “git_log”
      next_stage: “code_review”
      environment: # 此阶段激活的上下文技能
        - “project_eslint_rules”
        - “project_coding_conventions”

    # 阶段 4: 代码提交与评审
    - id: “code_review”
      name: “代码评审”
      description: “对提交的代码进行质量、安全与规范审查。”
      skills:
        - “static_code_analysis”       # 静态代码分析
        - “security_vulnerability_scan” # 安全漏洞扫描
        - “performance_budget_check”   # 性能预算检查
        - “pull_request_review”        # PR审阅评论
      trigger:
        type: “event”
        event: “git_push”
        branch: “feature/*” # 仅对特性分支触发
      inputs:
        - type: “git_diff”
          ref: “${event.commit_sha}”
      outputs:
        - name: “代码评审报告”
          format: “markdown”
          template: “templates/review_report.md”
        - name: “问题列表”
          format: “json”
          action: “create_github_issues” # 可自动创建Issue
      next_stage: “test_regression”
      gates: # 质量门禁
        blocker_issues: 0 # 阻塞性问题必须为0
        approval_threshold: 1 # 至少需要1人批准

    # 阶段 5: 测试回归 (新增)
    - id: “test_regression”
      name: “测试回归”
      description: “在类生产环境中运行完整的自动化测试套件。”
      skills:
        - “e2e_testing”        # 端到端测试
        - “integration_testing” # 集成测试
        - “performance_testing” # 性能测试 (Lighthouse)
        - “visual_regression_testing” # 视觉回归测试
      trigger:
        type: “auto”
        condition: “code_review.outputs.review_passed == true”
      inputs:
        - type: “artifact”
          ref: “development.outputs.源代码”
        - type: “url”
          name: “staging_environment”
          default: “https://staging.example.com”
      outputs:
        - name: “自动化测试报告”
          format: “html”
        - name: “性能分析报告”
          format: “json”
        - name: “测试覆盖率报告”
          format: “lcov”
      next_stage: “deployment”
      gates:
        e2e_pass_rate: 100%
        performance_score: “>=90”
        coverage_threshold: “>=80%”

    # 阶段 6: 上线回归
    - id: “deployment”
      name: “上线回归”
      description: “执行部署到生产环境，并进行上线后验证。”
      skills:
        - “ci_cd_pipeline_management” # CI/CD流水线管理
        - “canary_deployment”         # 金丝雀发布
        - “health_check_monitoring”   # 健康检查与监控
        - “rollback_procedure”        # 回滚流程
      trigger:
        type: “manual” # 上线通常需要手动确认
        condition: “test_regression.outputs.all_passed == true”
        approval_required: true
      inputs:
        - type: “version”
          name: “release_version”
      outputs:
        - name: “部署成功记录”
          format: “log”
        - name: “上线后健康状态”
          format: “dashboard_link”
        - name: “版本发布说明”
          format: “markdown”
      final: true
      post_actions:
        - skill: “monitor_alerts”
          duration: “1h” # 上线后监控1小时
        - skill: “notify_team”
          channel: “slack”

  # ========== 全局技能配置区域 ==========
  skills_registry: “./.sfcode/skills/registry.yaml” # 指向外部技能注册表

  # 各阶段技能执行的通用配置
  execution_config:
    default_timeout: 300 # 秒
    max_retries: 2
    stop_on_critical_failure: true
    log_level: “info”

  # 钩子函数 (生命周期事件)
  hooks:
    on_stage_start:
      - skill: “notify_status”
        params: { “message”: “阶段 ${stage.name} 开始执行” }
    on_stage_success:
      - skill: “generate_summary”
    on_stage_failure:
      - skill: “create_incident_ticket”
      - skill: “notify_maintainer”
    on_workflow_complete:
      - skill: “archive_reports”
      - skill: “cleanup_temporary_files”

  # 集成配置
  integrations:
    version_control:
      type: “git”
      provider: “github”
      webhooks_enabled: true
    project_management:
      type: “jira”
      auto_transition_issues: true
    communication:
      - type: “slack”
        channel: “#dev-alerts”
      - type: “email”
        group: “engineering-team@company.com”
